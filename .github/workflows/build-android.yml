name: Build Android (APK + AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      # Optional Play signing: add these repository secrets to get signed release builds.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 compiles with Java 21 (sourceCompatibility 21, Android Gradle Plugin 8.13);
      # JDK 17 cannot build it.
      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform (API 36)
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # The native bundle is served from the app root, not the /USEus/ GitHub Pages path.
      - name: Build web bundle
        run: npm run build
        env:
          BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://qdyinlqunsagypgaugky.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_M0InuYBC-lZE68NXXE8Q-w_epXI3Y7U' }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK, release APK and Play App Bundle (AAB)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease

      - name: Collect outputs
        run: |
          mkdir -p out/apk out/aab
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/apk/USEus-$VERSION_NAME-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/apk/USEus-$VERSION_NAME-release.apk"
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "out/apk/USEus-$VERSION_NAME-release-unsigned.apk"
          fi
          cp android/app/build/outputs/bundle/release/app-release.aab "out/aab/USEus-$VERSION_NAME-release.aab"
          ls -la out/apk out/aab
          {
            echo "### USEus Android $VERSION_NAME (versionCode $VERSION_CODE)"
            echo ""
            echo "- **Install on your phone:** download the \`USEus-apk\` artifact and open \`USEus-$VERSION_NAME-debug.apk\`."
            echo "- **Google Play:** upload \`USEus-$VERSION_NAME-release.aab\` from the \`USEus-aab\` artifact."
            if [ "$HAS_KEYSTORE" != "true" ]; then
              echo "- Release builds are **unsigned**: add the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets to sign them for Play."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: USEus-apk
          path: out/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: USEus-aab
          path: out/aab/*.aab
          if-no-files-found: error
          retention-days: 30
